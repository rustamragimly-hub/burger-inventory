# Конфигурация линтера ruff для проекта Revisi.
# Осознанно отключённые правила — не баги, а принятый стиль монолита.
line-length = 120

[lint]
# E741 — однобуквенные имена l/r/p в comprehensions по доменным сущностям
#        (location, revision, product) читаются понятно в контексте.
# E402 — несколько ленивых импортов внутри функций (send_from_directory и т.п.)
#        сделаны намеренно, чтобы не тянуть зависимости на старте.
ignore = ["E741", "E402"]

[lint.per-file-ignores]
# В тестах допускаем компактные фабрики через «;» и импорты после env-setup.
"tests/*" = ["E702", "E402"]

