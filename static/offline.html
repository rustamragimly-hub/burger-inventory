<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Нет соединения — Revisi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f1725; color: #fff; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    text-align: center;
  }
  .box { max-width: 340px; }
  .emoji { font-size: 56px; margin-bottom: 18px; }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  p { font-size: 15px; line-height: 1.55; color: rgba(255,255,255,0.6); margin-bottom: 24px; }
  button {
    background: #fb923c; color: #1a0c00; border: none; border-radius: 10px;
    padding: 13px 26px; font-size: 15px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
  <div class="box">
    <div class="emoji">📡</div>
    <h1>Нет соединения</h1>
    <p>Не удалось связаться с сервером. Проверьте интернет — данные ревизий никуда не пропали, они синхронизируются, как только связь вернётся.</p>
    <button onclick="location.reload()">Повторить</button>
  </div>
</body>
</html>
