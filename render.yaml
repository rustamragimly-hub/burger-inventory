services:
  - type: web
    name: spurt-app
    env: python
    plan: free
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    # 2 воркера × 4 потока = 8 одновременных запросов; --preload экономит RAM
    # на Free 512MB; --timeout 30 убивает зависшие запросы.
    startCommand: "gunicorn app:app --workers 2 --threads 4 --timeout 30 --preload --access-logfile - --error-logfile -"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: FLASK_ENV
        value: "production"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: spurt-db
          property: connectionString

databases:
  - name: spurt-db
    plan: free
    databaseName: spurt_db
    user: spurt_user
