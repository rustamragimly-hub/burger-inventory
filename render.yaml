services:
  - type: web
    name: spurt-app
    env: python
    plan: free
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: FLASK_ENV
        value: "production"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: spurt-db
          property: connectionString

databases:
  - name: spurt-db
    plan: free
    databaseName: spurt_db
    user: spurt_user
